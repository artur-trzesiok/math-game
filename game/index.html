<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Math Game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font: 16px/1.4 system-ui, sans-serif; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  #stage { position: fixed; inset: 0; background: #000; }
  #stage canvas { display: block; }
  /* the menu: one long strip of lessons scrolled sideways (a finger, the wheel or a mouse drag), the topics marked
     along it as tinted blocks; sized from the height so it fits the 4:3 safe area of a tablet and a phone alike */
  #menu { --k: max(110px, min(36vh, 62vw)); --safe: max(16px, calc((100vw - 133.34vh) / 2 + 16px));
          position: fixed; inset: 0; display: none; flex-direction: column; justify-content: center; gap: 2.4vh; overflow: hidden; box-sizing: border-box; background: linear-gradient(#bfe4ff, #e9f7d8); opacity: 0; transition: opacity .7s ease; }
  #menu.in { opacity: 1; }
  #iris { position: fixed; inset: 0; display: none; background: #2f7fe0; pointer-events: none; }
  #fade { position: fixed; inset: 0; display: none; background: #1a2a3a; opacity: 0; transition: opacity .35s ease; pointer-events: none; }
  #menu h1 { margin: 0; font-size: max(22px, calc(var(--k) * 0.19)); color: #2a4a6a; text-align: center; }
  #langs { text-align: center; }
  #lessons { display: flex; align-items: stretch; gap: calc(var(--k) * 0.12); overflow-x: auto; overflow-y: hidden; padding: 6px var(--safe) 14px; box-sizing: border-box; width: 100%;
             overscroll-behavior-x: contain; scrollbar-width: none; cursor: grab;
             -webkit-mask-image: linear-gradient(90deg, transparent, #000 var(--fade-l, 0px), #000 calc(100% - var(--fade-r, 0px)), transparent); mask-image: linear-gradient(90deg, transparent, #000 var(--fade-l, 0px), #000 calc(100% - var(--fade-r, 0px)), transparent); }
  #lessons::-webkit-scrollbar { display: none; }
  #lessons.drag { cursor: grabbing; }
  .topic { flex: 0 0 auto; display: flex; flex-direction: column; gap: calc(var(--k) * 0.06); padding: calc(var(--k) * 0.07) calc(var(--k) * 0.08) calc(var(--k) * 0.1); border-radius: calc(var(--k) * 0.16);
           background: color-mix(in srgb, var(--c) 18%, transparent); box-shadow: inset 0 0 0 3px color-mix(in srgb, var(--c) 45%, transparent); }
  .topic h2 { margin: 0 0 0 4px; font-size: max(14px, calc(var(--k) * 0.1)); color: #2a4a6a; display: flex; align-items: center; gap: 10px; white-space: nowrap; }
  .topic h2::before { content: ""; width: .6em; height: .6em; border-radius: 50%; background: var(--c); }
  .topic .row { display: flex; gap: calc(var(--k) * 0.08); }
  .topic .lesson { flex: 0 0 auto; }
  #chips { display: flex; justify-content: center; gap: calc(var(--k) * 0.035); padding: 0 var(--safe); white-space: nowrap; }
  @media (max-height: 520px) { #menu { --k: 31vh; gap: 1.8vh; } .lesson .sub { display: none; } #chips button { padding: .3em .75em; } }
  #chips button { font: inherit; font-size: max(11px, min(calc(var(--k) * 0.068), 1.5vw)); font-weight: 700; padding: .35em .9em; border: 0; border-radius: 999px; color: #2a4a6a; background: rgba(255,255,255,.7); cursor: pointer; display: flex; align-items: center; gap: .45em; }
  #chips button::before { content: ""; width: .7em; height: .7em; border-radius: 50%; background: var(--c); }
  #chips button.on { background: var(--c); color: #fff; }
  #chips button.on::before { background: #fff; }
  .lesson { position: relative; display: flex; flex-direction: column; align-items: center; gap: calc(var(--k) * 0.03); width: calc(var(--k) * 1.16); padding: calc(var(--k) * 0.07) calc(var(--k) * 0.08) calc(var(--k) * 0.09); border: 0; border-radius: calc(var(--k) * 0.11); background: #fff; box-shadow: 0 6px 0 #c7d8e6; font: inherit; cursor: pointer; }
  .lesson:active { transform: translateY(3px); box-shadow: 0 3px 0 #c7d8e6; }
  .lesson .cover { width: var(--k); height: var(--k); border-radius: calc(var(--k) * 0.08); object-fit: cover; background: #e9f7d8; pointer-events: none; -webkit-user-drag: none; }
  .lesson .nr { position: absolute; top: calc(var(--k) * 0.03); left: calc(var(--k) * 0.03); width: calc(var(--k) * 0.19); height: calc(var(--k) * 0.19); border-radius: 50%; background: #ffb347; color: #fff; font-size: calc(var(--k) * 0.105); font-weight: 700; display: grid; place-items: center; box-shadow: 0 2px 4px rgba(0,0,0,.25); }
  .lesson .name { font-size: max(13px, calc(var(--k) * 0.088)); font-weight: 700; color: #2a4a6a; text-align: center; line-height: 1.15; }
  .lesson .sub { font-size: max(11px, calc(var(--k) * 0.056)); color: #6a7f94; text-align: center; }
  #langs button { font: inherit; font-size: max(12px, calc(var(--k) * 0.06)); padding: .3em .8em; border: 2px solid #2a4a6a; border-radius: .7em; background: #fff; color: #2a4a6a; margin: 0 .25em; cursor: pointer; }
  #langs button.on { background: #2a4a6a; color: #fff; }
  #hud { position: fixed; top: 0; left: 0; right: 0; display: none; align-items: center; gap: 12px; padding: 10px 14px; pointer-events: none; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  #hud .lesson-name { font-weight: 700; }
  @media (max-width: 900px) { #hud .lesson-name { display: none; } }
  #hud .phases { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); display: flex; gap: 10px; }
  #hud .phases { gap: 16px; }
  #hud .phase { display: block; width: min(72px, 8vh); height: min(72px, 8vh); border-radius: 22px; background: rgba(255,255,255,.35); padding: 5px; box-sizing: border-box; transition: transform .3s, background .3s, opacity .3s; }
  #hud .phase img { display: block; width: 100%; height: 100%; object-fit: contain; }   /* the icon's own card is never clipped by the round frame (iPad) */
  #hud .phase.current { background: #ffb347; transform: scale(1.18); box-shadow: 0 3px 10px rgba(0,0,0,.3); }
  #hud .phase.done { background: rgba(255,255,255,.75); opacity: .75; }
  #hud .phase.ahead { opacity: .45; filter: grayscale(.4); }
  #hud .phase.debug { pointer-events: auto; cursor: pointer; outline: 2px dashed rgba(255,255,255,.6); }
  #hud .menu, #hud .ster { pointer-events: auto; margin-left: auto; font: inherit; padding: 8px 14px; border: 0; border-radius: 14px; background: rgba(255,255,255,.85); color: #2a4a6a; cursor: pointer; }
  #hud .ster { margin-left: 0; min-width: 2.6em; }
  #hud .ster:first-of-type { margin-left: auto; }
  #hud .menu { margin-left: 0; }
  #hud .gwiazdki { position: absolute; left: 50%; top: calc(18px + min(72px, 8vh) * 1.18); transform: translateX(-50%); display: flex; gap: 6px; padding: 6px 14px; border-radius: 999px; background: rgba(30,50,30,.38); box-shadow: 0 2px 6px rgba(0,0,0,.25); }   /* under the phase icons, centred */
  #hud .gwiazdki:empty { display: none; }
  #hud .gwiazdki svg { width: min(56px, 7vh); height: min(56px, 7vh); transition: transform .3s; filter: drop-shadow(0 1px 2px rgba(0,0,0,.35)); }
  #hud .gwiazdki svg.pelna { animation: gw .45s ease-out; }
  @keyframes gw { 0% { transform: scale(.3) rotate(-40deg); } 60% { transform: scale(1.35) rotate(10deg); } 100% { transform: scale(1); } }
  #seria { position: fixed; left: 50%; top: 18%; transform: translateX(-50%) scale(0); display: flex; gap: 6px; align-items: center; padding: 10px 18px; border-radius: 999px; background: #ff9a3c; box-shadow: 0 4px 14px rgba(0,0,0,.25); pointer-events: none; transition: transform .35s cubic-bezier(.3,1.6,.5,1); }
  #seria.on { transform: translateX(-50%) scale(1); }
  #seria svg { width: 34px; height: 34px; }
  #pauza { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(10,20,40,.45); }
  #pauza button { width: min(30vh, 220px); height: min(30vh, 220px); border-radius: 50%; border: 0; background: #fff; box-shadow: 0 8px 0 #c7d8e6; cursor: pointer; }
  #pauza svg { width: 50%; height: 50%; }
  #subtitle { position: fixed; left: 50%; bottom: 6%; transform: translateX(-50%); display: none; max-width: 80%; padding: 10px 18px; border-radius: 16px; background: rgba(0,0,0,.55); color: #fff; font-size: 20px; text-align: center; pointer-events: none; }
  #card { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.25); }
  #card .box { background: #fff; border-radius: 26px; padding: 30px 36px; max-width: 70%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  #card .text { font-size: 22px; color: #2a4a6a; white-space: pre-line; margin-bottom: 22px; }
  #card button { font: inherit; font-size: 20px; padding: 12px 34px; border: 0; border-radius: 18px; background: #ffb347; color: #fff; cursor: pointer; box-shadow: 0 5px 0 #d8902c; }
  #card button:active { transform: translateY(3px); box-shadow: 0 2px 0 #d8902c; }
</style>
<script>
  // cache busting (engine/v.js): one stamp per page load on every file, the engine's modules included -
  // the import map remaps each module URL to the same URL with ?t=<stamp>
  window.__T = Date.now();
  (() => {
    const im = { imports: {
      three: "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } };
    for (const n of ["player", "scene", "lalka", "siatka", "tlo", "olowek", "liczby", "sfx", "speech", "i18n", "v", "geometria", "efekty", "ubior", "odblokuj"])
      im.imports[`/game/engine/${n}.js`] = `/game/engine/${n}.js?t=${window.__T}`;
    const s = document.createElement("script"); s.type = "importmap"; s.textContent = JSON.stringify(im);
    document.currentScript.after(s);
  })();
</script>
<div id="stage"></div>
<div id="hud"><span class="lesson-name"></span>
  <span class="phases"><span class="phase" data-stage="story"><img data-src="/game/assets/objects/ikona_opowiesc.webp" alt=""></span><span class="phase" data-stage="practice"><img data-src="/game/assets/objects/ikona_cwiczenia.webp" alt=""></span><span class="phase" data-stage="apply"><img data-src="/game/assets/objects/ikona_dom.webp" alt=""></span></span>
  <span class="gwiazdki"></span>
  <button class="ster pauza" aria-label="pauza">❚❚</button><button class="ster dalej" aria-label="dalej">▶▶</button><button class="ster pelny" aria-label="pełny ekran">⛶</button><button class="menu">☰</button></div>
<div id="seria"></div>
<div id="pauza"><button aria-label="graj"><svg viewBox="0 0 10 10"><path d="M3 2 L8 5 L3 8 Z" fill="#2a4a6a"/></svg></button></div>
<div id="menu"><h1 id="title"></h1><div id="langs"></div><div id="lessons"></div><div id="chips"></div></div>
<div id="subtitle"></div>
<div id="iris"></div>
<div id="fade"></div>
<div id="card"><div class="box"><div class="text"></div><button></button></div></div>
<script type="module">
  import { Player } from "./engine/player.js";
  import { v } from "./engine/v.js";
  for (const img of document.querySelectorAll("#hud .phase img")) img.src = v(img.dataset.src);   // src only now, with the stamp
  new Player().boot();
</script>
</html>
