<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<title>Math Game</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font: 16px/1.4 system-ui, sans-serif; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
  #stage { position: fixed; inset: 0; background: #000; }
  #stage canvas { display: block; }
  #menu { position: fixed; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: safe center; gap: 24px; overflow-y: auto; padding-top: 28px; box-sizing: border-box; background: linear-gradient(#bfe4ff, #e9f7d8); opacity: 0; transition: opacity .7s ease; }
  #menu.in { opacity: 1; }
  #iris { position: fixed; inset: 0; display: none; background: #2f7fe0; pointer-events: none; }
  #fade { position: fixed; inset: 0; display: none; background: #1a2a3a; opacity: 0; transition: opacity .35s ease; pointer-events: none; }
  #menu h1 { margin: 0; font-size: 44px; color: #2a4a6a; }
  #lessons { display: flex; flex-direction: column; gap: 22px; width: min(100%, 1060px); padding: 0 16px 32px; box-sizing: border-box; }
  .topic h2 { margin: 0 0 12px; font-size: 24px; color: #2a4a6a; display: flex; align-items: center; gap: 10px; }
  .topic h2::before { content: ""; width: 14px; height: 14px; border-radius: 50%; background: var(--c); }
  .topic .row { display: flex; gap: 18px; overflow-x: auto; padding: 4px 4px 10px; scroll-snap-type: x mandatory; }
  .topic .lesson { flex: 0 0 auto; scroll-snap-align: start; }
  .lesson { position: relative; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 230px; padding: 16px 16px 20px; border: 0; border-radius: 22px; background: #fff; box-shadow: 0 6px 0 #c7d8e6; font: inherit; cursor: pointer; }
  .lesson:active { transform: translateY(3px); box-shadow: 0 3px 0 #c7d8e6; }
  .lesson .cover { width: 198px; height: 198px; border-radius: 16px; object-fit: cover; background: #e9f7d8; }
  .lesson .nr { position: absolute; top: 6px; left: 6px; width: 40px; height: 40px; border-radius: 50%; background: #ffb347; color: #fff; font-size: 22px; font-weight: 700; display: grid; place-items: center; box-shadow: 0 2px 4px rgba(0,0,0,.25); }
  .lesson .name { font-size: 20px; font-weight: 700; color: #2a4a6a; text-align: center; }
  .lesson .sub { font-size: 13px; color: #6a7f94; text-align: center; }
  #langs button { font: inherit; padding: 6px 14px; border: 2px solid #2a4a6a; border-radius: 12px; background: #fff; color: #2a4a6a; margin: 0 4px; cursor: pointer; }
  #langs button.on { background: #2a4a6a; color: #fff; }
  #hud { position: fixed; top: 0; left: 0; right: 0; display: none; align-items: center; gap: 12px; padding: 10px 14px; pointer-events: none; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.5); }
  #hud .lesson-name { font-weight: 700; }
  @media (max-width: 900px) { #hud .lesson-name { display: none; } }
  #hud .phases { position: absolute; left: 50%; top: 10px; transform: translateX(-50%); display: flex; gap: 10px; }
  #hud .phases { gap: 16px; }
  #hud .phase { width: min(72px, 8vh); height: min(72px, 8vh); border-radius: 22px; object-fit: contain; background: rgba(255,255,255,.35); padding: 4px; box-sizing: border-box; transition: transform .3s, background .3s, opacity .3s; }
  #hud .phase.current { background: #ffb347; transform: scale(1.18); box-shadow: 0 3px 10px rgba(0,0,0,.3); }
  #hud .phase.done { background: rgba(255,255,255,.75); opacity: .75; }
  #hud .phase.ahead { opacity: .45; filter: grayscale(.4); }
  #hud .phase.debug { pointer-events: auto; cursor: pointer; outline: 2px dashed rgba(255,255,255,.6); }
  #hud .menu { pointer-events: auto; margin-left: auto; font: inherit; padding: 8px 14px; border: 0; border-radius: 14px; background: rgba(255,255,255,.85); color: #2a4a6a; cursor: pointer; }
  #subtitle { position: fixed; left: 50%; bottom: 6%; transform: translateX(-50%); display: none; max-width: 80%; padding: 10px 18px; border-radius: 16px; background: rgba(0,0,0,.55); color: #fff; font-size: 20px; text-align: center; pointer-events: none; }
  #card { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.25); }
  #card .box { background: #fff; border-radius: 26px; padding: 30px 36px; max-width: 70%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.3); }
  #card .text { font-size: 22px; color: #2a4a6a; white-space: pre-line; margin-bottom: 22px; }
  #card button { font: inherit; font-size: 20px; padding: 12px 34px; border: 0; border-radius: 18px; background: #ffb347; color: #fff; cursor: pointer; box-shadow: 0 5px 0 #d8902c; }
  #card button:active { transform: translateY(3px); box-shadow: 0 2px 0 #d8902c; }
</style>
<script>
  // cache busting (engine/v.js): one stamp per page load on every file, the engine's modules included -
  // the import map remaps each module URL to the same URL with ?t=<stamp>
  window.__T = Date.now();
  (() => {
    const im = { imports: {
      three: "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } };
    for (const n of ["player", "scene", "lalka", "siatka", "tlo", "olowek", "liczby", "sfx", "speech", "i18n", "v", "geometria"])
      im.imports[`/game/engine/${n}.js`] = `/game/engine/${n}.js?t=${window.__T}`;
    const s = document.createElement("script"); s.type = "importmap"; s.textContent = JSON.stringify(im);
    document.currentScript.after(s);
  })();
</script>
<div id="stage"></div>
<div id="hud"><span class="lesson-name"></span>
  <span class="phases"><img class="phase" data-stage="story" data-src="/game/assets/objects/ikona_opowiesc.webp" alt=""><img class="phase" data-stage="practice" data-src="/game/assets/objects/ikona_cwiczenia.webp" alt=""><img class="phase" data-stage="apply" data-src="/game/assets/objects/ikona_dom.webp" alt=""></span>
  <button class="menu">☰</button></div>
<div id="menu"><h1 id="title"></h1><div id="langs"></div><div id="lessons"></div></div>
<div id="subtitle"></div>
<div id="iris"></div>
<div id="fade"></div>
<div id="card"><div class="box"><div class="text"></div><button></button></div></div>
<script type="module">
  import { Player } from "./engine/player.js";
  import { v } from "./engine/v.js";
  for (const img of document.querySelectorAll("#hud .phase")) img.src = v(img.dataset.src);   // src only now, with the stamp
  new Player().boot();
</script>
</html>
