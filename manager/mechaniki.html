<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mechaniki</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 14px/1.45 system-ui, sans-serif; overflow: hidden; }
  #scena { position: fixed; inset: 0; }
  #pasek { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 8px 12px; background: rgba(20,20,20,.85); }
  button { font: inherit; background: #3a3a3a; color: #eee; border: 1px solid #555; border-radius: 4px; padding: 3px 10px; cursor: pointer; }
  button.on { background: #2d6cdf; border-color: #2d6cdf; }
  #info { color: #cfc; }
</style>
<script>
  // the engine's modules with one stamp per page load (as the game and the editor do, engine/v.js)
  window.__T = Date.now();
  (() => {
    const im = { imports: { three: "/game/vendor/three.module.js" } };
    for (const n of ["player", "scene", "lalka", "siatka", "tlo", "olowek", "liczby", "sfx", "speech", "i18n", "v", "geometria", "efekty", "ubior", "odblokuj", "album", "rytm", "mechaniki", "mechaniki2", "mechaniki3", "warianty", "muzyka", "ilustracje", "mechaniki4", "mechaniki5", "oddechy", "mechaniki6", "mechaniki7"])
      im.imports[`/game/engine/${n}.js`] = `/game/engine/${n}.js?t=${window.__T}`;
    const s = document.createElement("script"); s.type = "importmap"; s.textContent = JSON.stringify(im); document.currentScript.after(s);
  })();
</script>
</head>
<body>
<div id="scena"></div>
<div id="pasek">
  <span>mechanika:</span>
  <span id="przyciski"></span>
  <span id="info"></span>
</div>
<script type="module">
// every mechanic of mechaniki.js on a stage of its own, to try by hand (and from the console: mech.uruchom("waga"))
import { Stage } from "/game/engine/scene.js";
import * as M from "/game/engine/mechaniki.js";
import * as M2 from "/game/engine/mechaniki2.js";
import * as M3 from "/game/engine/mechaniki3.js";
import * as IL from "/game/engine/ilustracje.js";
import * as M4 from "/game/engine/mechaniki4.js";
import * as M5 from "/game/engine/mechaniki5.js";
import * as G from "/game/engine/geometria.js";
import * as OD from "/game/engine/oddechy.js";
const $ = (id) => document.getElementById(id);
// the breathers' pool lines shown as text (the demo has no recordings): who says what
const ODDECHY = await fetch("/game/oddechy/i18n/pl.json", { cache: "no-store" }).then((r) => r.json());
const mowO = async (kto, key, { ukryty = false } = {}) => { $("info").textContent = `${kto}${ukryty ? " (zza krzaka)" : ""}: ${ODDECHY[`line.${key}`]?.text || key}`; if (!ukryty && S.puppets[kto]) { S.ostatniMowca = kto; S.puppets[kto].graj("Mowienie", true); } await czekaj(1.4); if (!ukryty) S.puppets[kto]?.spoczynek(); };
const czekaj = (s) => new Promise((r) => setTimeout(r, s * 1000));
// a character "speaking" on the demo stage (no recordings here): the badge follows S.ostatniMowca
const mow = async (kto, s = 2.5) => { S.ostatniMowca = kto; S.puppets[kto].graj("Mowienie", true); await czekaj(s); S.puppets[kto].spoczynek(); };
const S = new Stage($("scena"), { tick() {}, say: async () => {}, stop() {} });
await S.background("laka");
await Promise.all([S.puppet("lisek", { x: -4.8, side: "left" }), S.puppet("sowa", { x: 4.8, side: "right" })]);
const info = (t) => { $("info").textContent = t; };
const pokaz = (...n) => { for (const k of Object.keys(S.puppets)) { const L = S.puppets[k]; L.korzen.visible = n.includes(k); if (L.cien) L.cien.visible = L.korzen.visible; } };
let bieg = 0;
const DEMA = {
  slad: async (nr) => { pokaz("lisek"); info("prowadź palcem po drodze od zielonej kropki"); for (const co of [3, "trojkat", "kolo"]) { if (nr !== bieg) return; await M.slad(S, co, { x: 0.4, y: 0.3 }); info(`gotowe: ${co}`); await new Promise((r) => setTimeout(r, 800)); S.clear(); } },
  waga: async (nr) => {
    pokaz("lisek", "sowa"); info("przeciągnij rzeczy na szalki");
    const w = await M.waga(S, { x: 0, y: -0.9 });
    const rzeczy = [];
    for (const [i, [n, m]] of [["jablko", 1], ["jablko", 1], ["dynia", 3], ["orzech", 0.5]].entries()) { const h = await S.object(n, { x: -3.4 + i * 0.9 + (i > 1 ? 4.8 : 0), y: -2.6, size: 0.8 }); h.masa = m; rzeczy.push(h); }
    const st = await w.przeciagaj({ rzeczy, gotowe: (s) => s.lewa.length + s.prawa.length === rzeczy.length });
    info(`waga: ${st.wynik()}`);
  },
  os: async () => {
    pokaz("lisek"); info("lisek skacze: 2 + 3");
    const o = await M.os(S, { od: 0, do: 10 });
    await o.skocz("lisek", 0, 2); await new Promise((r) => setTimeout(r, 500)); await o.skocz("lisek", 2, 5); info("lisek na 5");
  },
  wieza: async () => {
    pokaz("sowa"); info("zbuduj wieżę: od największego klocka; węższy pod szerszym się przewraca");
    const w = M.wieza(S, { klocki: [{ w: 2.4, h: 0.6, x: -4, y: -1.0 }, { w: 1.8, h: 0.6, x: -3.4, y: 0.2 }, { w: 1.2, h: 0.6, x: -2.6, y: 1.4 }, { w: 0.7, h: 0.6, x: 3.0, y: 1.4 }], miejsca: [{ x: 0.6 }] });
    await w.gotowe; info(`wieża: ${w.wysokosc(w.miejsca[0]).toFixed(1)} wysokości`);
  },
  kubki: async () => {
    pokaz("lisek", "sowa"); info("pod którym kubkiem jest gwiazdka?");
    const k = await M.kubki(S, { ile: 3, rzeczy: [null, "gwiazdka", null] });
    await new Promise((r) => setTimeout(r, 900)); await k.przykryj(); await k.tasuj(5);
    const hit = await S.choose(k.kubki); await k.odkryj(hit); info(hit.pod ? "znaleziona!" : "pusto");
  },
  dzwieki: async () => { pokaz("lisek"); info("lisek klaszcze 4 razy, potem bęben 3 razy"); await M.dzwieki(S, 4, { kto: "lisek", ruch: "klask" }); await new Promise((r) => setTimeout(r, 700)); await M.dzwieki(S, 3, { dzwiek: "beben" }); info("koniec"); },
  podziel: async (nr) => {
    pokaz("lisek", "sowa"); info("przetnij pizzę na pół palcem");
    let w = await M.podziel(S, "pizza", { x: 0, y: 0.3 }); info(`pizza: ${w.rowne ? "po równo" : "nierówno"} (${w.ulamek.map((u) => Math.round(u * 100) + "%").join(" / ")})`);
    await new Promise((r) => setTimeout(r, 1500)); if (nr !== bieg) return; w.remove();
    info("czekolada na cztery: dwa cięcia");
    w = await M.podziel(S, "czekolada", { x: 0, y: 0.3, ciecia: 2 }); info(`czekolada: ${w.czesci} części, ${w.rowne ? "po równo" : "nierówno"}`);
  },
  memory: async () => { pokaz(); info("znajdź pary: kropki i cyfra, jabłko i jabłko"); await M2.memory(S, [[{ kropki: 3 }, { cyfra: 3 }], [{ obraz: "jablko" }, { obraz: "jablko" }], [{ kropki: 5 }, { cyfra: 5 }], [{ obraz: "gruszka" }, { obraz: "gruszka" }]]); info("wszystkie pary!"); },
  sklepik: async () => { pokaz("lisek"); info("zapłać za jabłko: tyle monet, ile kropek na metce"); await M2.sklepik(S, { towar: "jablko", cena: 3, onZaDuzo: () => info("za dużo!") }); info("zapłacone"); },
  strzalki: async () => { pokaz(); info("ułóż strzałki i wciśnij zielony guzik"); await M2.strzalki(S, { przeszkody: [[2, 0], [2, 1]] }); info("jeż przy marchewce!"); },
  cienie: async () => {
    pokaz("sowa"); info("czyj to cień? wskaż");
    const c = M2.cien(S, await S.object("gruszka", { x: 0, y: 1.6, size: 2.0 }), true);
    const opcje = []; for (const [i, n] of ["jablko", "gruszka", "marchewka"].entries()) opcje.push(await S.object(n, { x: -2 + i * 2, y: -2.3, size: 1.1 }));
    const hit = await S.choose(opcje); info(hit.name === "gruszka" ? "tak, gruszka!" : "to nie ten"); if (hit.name === "gruszka") M2.cien(S, c, false);
  },
  odbicie: async () => {
    pokaz("lisek"); S.puppets.lisek.korzen.position.x = 0; info("czego brakuje w odbiciu?");
    const o = await M2.odbicie(S, "lisek", { woda: 0.0, ubrania: ["szalik", "kapelusz"], rozne: ["szalik"] });
    S.puppets.lisek.graj("Machanie"); await new Promise((r) => setTimeout(r, 1500));
    await o.znajdz(); info("znalezione!");
  },
  polacz: async () => {
    pokaz(); info("połącz palcem pary: co pasuje do czego");
    const L = [], P = [];
    for (const [i, n] of ["skarpetka", "kubek", "kwiatek"].entries()) { const h = await S.object(n, { x: -2.4, y: 1.6 - i * 1.6, size: 1.1 }); L.push(h); }
    for (const [i, n] of ["talerz", "motyl", "but"].entries()) { const h = await S.object(n, { x: 2.4, y: 1.6 - i * 1.6, size: 1.1 }); P.push(h); }
    const pary = { skarpetka: "but", kubek: "talerz", kwiatek: "motyl" };
    await M2.polacz(S, { lewe: L, prawe: P, para: (a, b) => pary[a.name] === b.name }); info("połączone!");
  },
  labirynt: async () => { pokaz("lisek", "sowa"); info("poprowadź jeżyka palcem przez labirynt do wyjścia"); await M3.labirynt(S, "zywoplot", { pionek: "jez", cel: "jablko" }); info("wyszedł!"); },
  znalezisko: async () => { pokaz("lisek", "sowa"); info("wskaż na mapie, gdzie ścieżka przecina strumyk"); const z = await M3.znalezisko(S, "mapa_polany", { skad: "lisek" }); const hit = await S.choose([...z.cele, z.tlo]); info(z.cele.includes(hit) ? "tak!" : "pudło"); await z.zaznacz(); },
  zagroda: async () => {
    pokaz(); info("otocz palcem płotem same kury (nie wilka)");
    const R = [];
    for (const [n, x, y] of [["kura", -2.2, 1.2], ["kura", -1.0, 0.4], ["kura", -2.4, -0.6], ["wilk", 2.4, 0.6]]) R.push(await S.object(n, { x, y, size: 1.1 }));
    await M3.zagroda(S, { rzeczy: R, chcemy: (h) => h.name === "kura", onOtwarta: () => info("płot ma dziurę!"), onZle: () => info("nie te w środku") }); info("zagroda gotowa!");
  },
  winda: async () => {
    pokaz(); info("pociągnij linę albo koszyk: do góry");
    const w = await M3.winda(S, { x: -0.5, pietra: [-2.0, 0.2, 2.0] });
    await w.wloz(await S.object("jablko", { x: 2, y: -2, size: 0.8 }));
    await w.doPoziomu(2); info("na górze! teraz na dół"); await w.doPoziomu(0); info("na dole!");
  },
  ramka: async () => {
    pokaz(); info("przeciągnij do ramki siedem jabłek");
    const r = await M3.ramka(S, { x: 0.4, y: 1.2 });
    const J = []; for (let i = 0; i < 9; i++) J.push(await S.object("jablko", { x: -3.2 + i * 0.85, y: -2.3, size: 0.8 }));
    await r.przeciagaj({ rzeczy: J, ile: 7, onZaDuzo: () => info("już siedem!") }); info("siedem: pięć i dwa");
  },
  domino: async () => {
    pokaz(); info("wskaż domino z pięcioma kropkami");
    const D = [[2, 3], [1, 1], [4, 2]].map(([a, b], i) => M3.domino(S, a, b, { x: -2 + i * 2, y: 0.6 }));
    const hit = await S.choose(D); info(hit.suma === 5 ? "tak, 2 + 3 = 5!" : "to " + hit.suma);
  },
  roznice: async () => { pokaz(); info("znajdź 3 różnice"); await M2.roznice(S, "laka"); info("wszystkie różnice!"); },
  kolorowanka: async () => { pokaz(); info("wybierz kredkę, potem pole z tą cyfrą"); await M2.kolorowanka(S, "domek"); info("pokolorowane!"); },
  ilustracja: async (nr) => {
    pokaz("lisek", "sowa");
    for (const [n, ruch] of [["pociag_most", "w_prawo"], ["burza_noc", "najazd"]]) {
      if (nr !== bieg) return;
      info(`ilustracja ${n}: ląduje jak znaczek, mówią postacie z plakietek, zsuwa się`);
      const il = await IL.ilustracja(S, n, { ruch });
      await mow("lisek"); await mow("sowa"); await czekaj(1.2);
      await il.zsun(); await czekaj(1);
    }
    info("koniec");
  },
  miejsca: async (nr) => {
    pokaz(); await S.background("przedpokoj");
    const m = await M4.miejsca(S);
    info("przedpokój: czapka na wieszak, but na dolną półkę szafki, piłka na wycieraczkę");
    const rzeczy = [];
    for (const [i, n] of ["czapka", "but", "pilka"].entries()) { const h = await S.object(n, { x: -1.5 + i * 1.6, y: -2.3, size: 1.0 }); rzeczy.push(h); }
    const cel = { czapka: "wieszak", but: "szafka_dol", pilka: "wycieraczka" };
    const t = await G.sloty(S, { items: rzeczy, slots: ["wieszak", "szafka_dol", "wycieraczka"].map((n) => m[n].slot((k) => cel[k.name] === n)), onWrong: () => info("to nie to miejsce") });
    await t.wait(); if (nr === bieg) info("wszystko na swoim miejscu: wisi, stoi, leży");
  },
  zdrapka: async (nr) => {
    pokaz("lisek", "sowa");
    for (const n of ["snieg_ogrodek", "szyba_rano"]) {
      if (nr !== bieg) return;
      info(`${n}: zetrzyj palcem osłonę`);
      const z = await M4.zdrapka(S, n);
      info(`odkryte - ${z.cele.length} rzeczy do policzenia/wskazania`); await z.zaznacz(); await czekaj(1.5); await z.remove();
    }
  },
  kropki: async (nr) => {
    pokaz("lisek", "sowa");
    info("gwiazdozbiór: łącz od najmniejszej gwiazdki do największej");
    let k = await M4.kropki(S, "niedzwiedz_gwiazd", { znaki: "wielkosc", onZle: () => info("najpierw najmniejsza") }); await czekaj(1.5); await k.remove();
    if (nr !== bieg) return;
    info("lokomotywa: łącz kropki od 1 do 10");
    k = await M4.kropki(S, "lokomotywa", { znaki: "cyfry", onZle: () => info("po kolei!") }); info("lokomotywa!");
  },
  podarty: async () => {
    pokaz("lisek", "sowa"); info("burza podarła mapę: złóż kawałki");
    const z = await M4.podarty(S, "mapa_polany", { kawalki: 4 });
    info("mapa cała - wskaż, gdzie ścieżka przecina strumyk"); const hit = await S.choose([...z.cele, z.tlo]); info(z.cele.includes(hit) ? "tak!" : "pudło"); await z.zaznacz();
  },
  wedrowka: async () => {
    pokaz("lisek", "sowa"); info("prowadź jeżyka krótszą ścieżką do koca (dłuższa się nie da)");
    const w = await M4.wedrowka(S, "mapa_pikniku", { pionek: "jez", dobra: 0, onZle: () => info("ta ścieżka jest dłuższa!") }); info("na pikniku!"); await czekaj(1.5); await w.remove();
  },
  kpn: async () => { pokaz("lisek", "sowa"); await OD.kpn(S, { kto: "sowa", mow: mowO }); },
  lustro: async () => { pokaz("lisek", "sowa"); await OD.lustro(S, { kto: "lisek", mow: mowO }); info("koniec"); },
  karmienie: async () => { pokaz("lisek", "sowa"); info("nakarm kaczkę bułką (kamyka nie zje)"); await OD.karmienie(S, { zwierze: "kaczka_mama", jedzenie: ["bulka", "bulka", "bulka"], fuj: ["kamyk"], kto: "lisek", mow: mowO }); info("najedzona!"); },
  latawiec: async () => { pokaz("lisek", "sowa"); await OD.latawiec(S, { ksztalt: "latawiec_trojkat", kto: "lisek", mow: mowO }); info("koniec"); },
  kto: async () => {
    pokaz("lisek", "sowa"); if (!S.puppets.zajac) await S.puppet("zajac", { x: 2.6, side: "right" }); S.puppets.zajac.korzen.visible = true;
    S.puppets.lisek.korzen.position.x = -4.8; S.puppets.zajac.korzen.position.x = 2.6;
    info("patrz, kto chowa się za którym krzakiem"); await OD.ktoPowiedzial(S, { gospodarz: "sowa", kryjowki: ["lisek", "zajac"], mow: mowO }); info("wszyscy znalezieni");
  },
  malowanie: async (nr) => {
    pokaz("lisek", "sowa");
    await OD.malowanie(S, { tlo: "noc", kto: "lisek", mow: mowO, czas: 8 });
    if (nr !== bieg) return; info("teraz zaparowana szyba: przetrzyj palcem");
    await OD.malowanie(S, { tlo: "szyba", zdrapka: "szyba_rano", kto: "sowa", mow: mowO, czas: 8 });
  },
  historyjka: async (nr) => {
    pokaz("lisek", "sowa");
    info("ułóż dzień Kreta po kolei: rano, południe, wieczór, noc");
    let h = await M4.historyjka(S, "dzien_kreta", { onZle: () => info("to nie to miejsce") }); await czekaj(1.5); h.remove();
    if (nr !== bieg) return;
    info("od jajka do kury");
    h = await M4.historyjka(S, "jajko_kura", { onZle: () => info("to nie to miejsce") }); info("po kolei!");
  },
  // mechaniki5.js: the grid (two features, the bookcase, a picture sudoku, a calendar to read), the hidden rule, giving out
  siatka: async (nr) => {
    pokaz("lisek", "sowa");
    info("dwie cechy: czerwone w górny rząd, żółte w dolny; liście w lewą kolumnę, chorągiewki w prawą");
    let s = await M5.siatka(S, { wiersze: ["koralik_czerwony", "koralik_zolty"], kolumny: ["listek", "choragiewka_niebieska"],
      rzeczy: [{ name: "lisc_zolty", wiersz: 1, kolumna: 0 }, { name: "choragiewka_czerwona", wiersz: 0, kolumna: 1 }, { name: "lisc_czerwony", wiersz: 0, kolumna: 0 }, { name: "choragiewka_zolta", wiersz: 1, kolumna: 1 }],
      onZle: () => info("nie pasuje do rzędu albo do kolumny") });
    if (nr !== bieg) return; info("tabela pełna; czytanie: rząd żółty, kolumna chorągiewek"); await s.pokaz(1, 1); await czekaj(0.6); s.remove();
    if (nr !== bieg) return; info("regał: gruszka na górę z lewej, piłka na środek, jabłko na dół z prawej");
    s = await M5.siatka(S, { plansza: "regal_3x3", rzeczy: [{ name: "pilka", wiersz: 1, kolumna: 1 }, { name: "jablko", wiersz: 2, kolumna: 2 }, { name: "gruszka", wiersz: 0, kolumna: 0 }], onZle: () => info("nie ta półka") });
    await czekaj(0.8); s.remove();
    if (nr !== bieg) return; info("sudoku: w każdym rzędzie i w każdej kolumnie każdy obrazek raz");
    const G3 = ["znak_gwiazda", "znak_kwiatek", "znak_slonce"], roz = [[0, 1, 2], [1, 2, 0], [2, 0, 1]].map((r) => r.map((i) => G3[i]));
    const dane = roz.map((r, i) => r.map((n, j) => ((i + j) % 2 ? n : null)));
    s = await M5.siatka(S, { komorki: dane, rozwiazanie: roz, sudoku: true, rzeczy: roz.flatMap((r, i) => r.filter((_, j) => !((i + j) % 2))).sort(() => Math.random() - 0.5), onZle: () => info("ten obrazek już jest w tym rzędzie albo kolumnie") });
    await czekaj(0.8); s.remove();
    if (nr !== bieg) return; info("kalendarz: wskaż dwunasty");
    const dni = [...Array(5)].map((_, r) => [...Array(7)].map((_, c) => { const d = r * 7 + c - 1; return d >= 1 && d <= 30 ? { cyfra: d } : null; }));
    s = await M5.siatka(S, { komorki: dni, kolumny: ["pora_rano", null, null, null, null, "znak_slonce", "znak_slonce"] });
    const hit = await S.choose(s.cele); info(hit.r * 7 + hit.c - 1 === 12 ? "tak, dwunasty!" : `to ${hit.r * 7 + hit.c - 1}`);
  },
  regula: async (nr) => {
    pokaz("lisek", "sowa"); info("sortuj do koszyka i pudełka - reguły nikt nie mówi");
    const kol = (n, k) => ({ name: n, kolor: k });
    let w = await M5.regula(S, { pojemniki: ["koszyk", "pudelko"], cecha: "kolor", wartosci: ["czerwony", "zolty"], poIlu: 3,
      rzeczy: [kol("lisc_czerwony", "czerwony"), kol("choragiewka_zolta", "zolty"), kol("koralik_czerwony", "czerwony"), kol("kubek_czerwony", "czerwony"), kol("lisc_zolty", "zolty"), kol("koralik_zolty", "zolty")].sort(() => Math.random() - 0.5),
      ikony: { czerwony: "koralik_czerwony", zolty: "koralik_zolty" },
      onRegula: async (r) => { info(`lisek: już wiem! wszystkie ${r.wartosci[0]} są w koszyku!`); await mow("lisek", 1.5); }, onZle: () => info("koszyk wypluwa - to nie jego rodzaj") });
    await czekaj(1); w.remove();
    if (nr !== bieg) return; info("posortuj sam: jak chcesz - kolorem albo kształtem; pierwsze ruchy decydują");
    const r2 = (n, kolor, rodzaj) => ({ name: n, kolor, rodzaj });
    w = await M5.regula(S, { pojemniki: ["skrzynia", "koszyk"], cechy: ["kolor", "rodzaj"], poIlu: 3,
      rzeczy: [r2("lisc_czerwony", "czerwony", "lisc"), r2("lisc_zolty", "zolty", "lisc"), r2("choragiewka_czerwona", "czerwony", "flaga"), r2("choragiewka_zolta", "zolty", "flaga")],
      onRegula: (r) => info(`sowa: sortujesz według: ${r.cecha} (${r.wartosci.join(" / ")})`), onZle: () => info("to nie pasuje do tego, co już tam jest") });
  },
  rozdaj: async (nr) => {
    pokaz("lisek", "sowa"); info("podziel jabłka po równo: do miski liska i miski sowy");
    let r = await M5.rozdaj(S, { komu: ["lisek", "sowa"], rzeczy: Array(6).fill("jablko"), onNierowno: (k) => info(`nierówno: ${k.join(" i ")} - przełóż`) });
    info(`po równo: ${r.kupki.join(" i ")}`); await czekaj(1.2); r.remove();
    if (nr !== bieg) return; info("skarpetki: czy każda ma parę? rozdaj, potem łączymy w pary");
    r = await M5.rozdaj(S, { komu: ["lisek", "sowa"], miski: null, rzeczy: Array(5).fill("skarpetka") });
    const p = await r.paruj(); info(`${p.pary} pary, ${p.bezPary.length} bez pary - nieparzyste`); await czekaj(1.5); r.remove();
    if (nr !== bieg) return; info("po dwa ciastka na każdy talerz (trzecie się nie zmieści)");
    r = await M5.rozdaj(S, { komu: [{ obraz: "talerz" }, { obraz: "talerz" }, { obraz: "talerz" }], ile: 2, rzeczy: Array(6).fill("ciastko"), onZle: () => info("już ma dwa!") });
    info("trzy talerze po dwa - sześć");
  },
  // mechaniki6.js
  szpara: async (nr) => {
    const M6 = await import("/game/engine/mechaniki6.js");
    pokaz("lisek", "sowa");
    info("przepchnij przez furtkę: gruby pień utknie, cienki patyk przejdzie");
    let s = await M6.szpara(S, { szpary: [{ obraz: "szpara_furtka", x: 0.3, szczelina: 0.75 }], rzeczy: [{ obraz: "bal", size: 1.2 }, { obraz: "patyk_wysoki", size: 1.6 }], onZle: () => info("za gruby - utknął!") });
    info("przeszedł!"); await czekaj(1.2); s.remove(); if (nr !== bieg) return;
    pokaz(); info("wąska i szeroka brama: co się zmieści?");
    s = await M6.szpara(S, { szpary: [{ obraz: "szpara_drzewa", x: -3.0, szczelina: 0.7 }, { obraz: "szpara_brama", x: 2.0, szczelina: 1.2 }], rzeczy: [{ obraz: "wagon", size: 1.1 }, { obraz: "klocek", size: 0.6 }], onZle: () => info("za szeroki!") });
    info("wszystko, co się mieści, przeszło"); await czekaj(1.2); s.remove(); if (nr !== bieg) return;
    pokaz("lisek", "sowa"); info("pod mostkiem: co się zmieści pod łukiem?");
    s = await M6.szpara(S, { szpary: [{ obraz: "szpara_mostek", x: 0.4, szczelina: 1.0 }], rzeczy: [{ obraz: "pilka", size: 0.9, toczy: true }, { obraz: "slonecznik_wysoki", size: 2.0 }], onZle: () => info("za wysoki!") });
    info("piłka przetoczyła się pod mostkiem");
  },
  miarka: async (nr) => {
    const M6 = await import("/game/engine/mechaniki6.js");
    pokaz("lisek", "sowa");
    info("zmierz deskę łapkami: przeciągaj łapki pod deskę");
    let m = await M6.miarka(S, { rzecz: "deska_dluga", dlugosc: 5, jednostka: "lapka", onLicz: (n) => info(`${n}`), onZle: (p) => info(`nie tak: ${p}`) });
    info(`deska ma ${m.ile} łapek`); await czekaj(1.2); m.remove(); if (nr !== bieg) return;
    info("klocki bez przyciągania: kładź jeden za drugim, bez przerw");
    m = await M6.miarka(S, { rzecz: "szalik_dlugi", dlugosc: 4, jednostka: "klocek", przyciagaj: false, onLicz: (n) => info(`${n}`), onZle: (p) => info(`nie tak: ${p}`) });
    info(`szalik ma ${m.ile} klocki`); await czekaj(1.2); m.remove(); if (nr !== bieg) return;
    info("linijka: przyłóż zero do kreski, potem wskaż liczbę na końcu");
    m = await M6.miarka(S, { rzecz: "deska_dluga", dlugosc: 7, jednostka: "linijka", onZle: (p) => info(p === "zero" ? "zacznij od zera!" : "popatrz, gdzie kończy się deska") });
    info(`${m.ile} centymetrów`); await czekaj(1.2); m.remove(); if (nr !== bieg) return;
    info("waga: dokładaj odważniki (duży = 2 kg), aż szalki będą równo");
    m = await M6.miarka(S, { rzecz: "dynia", jednostka: "odwaznik", masa: 3, wagi: [2, 2, 1, 1], onLicz: (n) => info(`${n} kg`), onZle: () => info("za dużo - przechyliło się!") });
    info(`dynia waży ${m.ile} kilogramy`);
  },
  wykres: async (nr) => {
    const M6 = await import("/game/engine/mechaniki6.js");
    pokaz("lisek", "sowa");
    info("ułóż owoce w słupkach nad ich obrazkami");
    let w = await M6.wykres(S, { rodzaje: ["jablko", "gruszka", "wisnia"], rzeczy: ["jablko", "jablko", "jablko", "gruszka", "wisnia", "wisnia", "wisnia", "wisnia", "gruszka"], onZle: (h) => info(`to nie jest słupek: ${h.rodzaj}`) });
    info("który słupek najwyższy? (dotknij)"); const hit = await S.choose(w.kolumny.map((k) => k.cel)); info(hit === w.najwyzsza()?.cel ? "tak, najwyższy!" : "nie ten"); await czekaj(1.2); await w.remove(); if (nr !== bieg) return;
    info("gotowy wykres pogody: wskaż najniższy słupek");
    w = await M6.wykres(S, { rodzaje: ["znak_slonce", "znak_tecza", "emocja_mokro"], wypelnij: { znak_slonce: 4, znak_tecza: 1, emocja_mokro: 2 } });
    const h2 = await S.choose(w.kolumny.map((k) => k.cel)); info(h2 === w.najnizsza()?.cel ? "tak, najniższy!" : "nie ten");
  },
  // mechaniki7.js
  zegar: async (nr) => {
    const M7 = await import("/game/engine/mechaniki7.js");
    pokaz("lisek", "sowa");
    const z = await M7.zegar(S, { godzina: 3, ruchome: "krotka" });
    info("ustaw krótką wskazówkę na siódmą (przeciągnij po tarczy)");
    await z.ustaw({ godzina: 7, onZle: (t) => info(`to ${t.godzina}, a ma być 7`) }); info("siódma!"); await czekaj(1); if (nr !== bieg) return;
    info("czas mija: zegar idzie do dziewiątej"); await z.pokaz(9, 0); await czekaj(0.8); z.remove(); if (nr !== bieg) return;
    const z2 = await M7.zegar(S, { godzina: 12, ruchome: "obie", polowki: true });
    info("ustaw wpół do czwartej: długa na dół, krótka między 3 a 4");
    await z2.ustaw({ godzina: 3, minuty: 30, onZle: (t) => info(`to ${t.godzina}:${String(t.minuty).padStart(2, "0")}`) }); info("wpół do czwartej!");
  },
  portrety: async (nr) => {
    const M7 = await import("/game/engine/mechaniki7.js");
    pokaz("lisek", "sowa"); info("kto ma okulary? odwróć tych, którzy nie mają");
    let p = await M7.portrety(S, { postacie: ["jez", "zajac", "bobr", "wiewiorka", "mis", "kret"], ubrania: { jez: ["okulary"], bobr: ["okulary", "kapelusz"], wiewiorka: ["kapelusz"], kret: ["okulary"] } });
    await p.odrzuc({ pasuje: (k) => ["jez", "bobr", "kret"].includes(k), onZle: (k) => info(`${k} ma okulary - zostaje`) });
    info("a kto ma też kapelusz?");
    const r = await p.odrzuc({ pasuje: (k) => k === "bobr", onZle: (k) => info(`${k} ma kapelusz`) }); info(`to ${r.join(", ")}!`); await czekaj(1.5); p.remove(); if (nr !== bieg) return;
    info("kto to od tyłu? znajdź misia");
    p = await M7.portrety(S, { postacie: ["mis", "zajac", "sowa", "jez"], widok: "tyl" });
    await p.znajdz("mis", { onZle: (k) => info(`to ${k}, nie miś`) }); info("miś!");
  },
  peczki: async (nr) => {
    const M7 = await import("/game/engine/mechaniki7.js");
    pokaz("lisek", "sowa"); info("ułóż trzynaście: przeciągaj patyczki na tacę (stuknięcie też kładzie); przy dziesięciu same się wiążą");
    let m = await M7.peczki(S, { zapas: 14 });
    await m.uloz({ cel: 13, onZle: (pw) => info(pw === "za_duzo" ? "za dużo!" : "za mało!") }); info("13 = pęczek i trzy"); await czekaj(1.5); m.remove(); if (nr !== bieg) return;
    info("32 - 5: zabierz pięć patyczków z tacy (stuknij pęczek, żeby go rozwiązać)");
    m = await M7.peczki(S, { peczki: 3, patyczki: 2 });
    await m.uloz({ cel: 27, onZle: (pw) => info(pw === "za_malo" ? "za dużo zabrane - rozwiąż pęczek" : "za dużo!") }); info("zostało 27");
  },
};
const uruchom = async (n) => {
  const nr = ++bieg; S.palec = null; S.endSort(); S.clear(); S.pending = null; S.targets = [];
  document.querySelectorAll("#przyciski button").forEach((b) => b.classList.toggle("on", b.dataset.n === n));
  try { await DEMA[n](nr); } catch (e) { info("błąd: " + e.message); console.error(e); }
};
$("przyciski").innerHTML = Object.keys(DEMA).map((n) => `<button data-n="${n}">${n}</button>`).join(" ");
$("przyciski").onclick = (e) => { const n = e.target.dataset?.n; if (n) uruchom(n); };
window.mech = { S, M, uruchom };
uruchom(new URLSearchParams(location.search).get("m") || "slad");
</script>
