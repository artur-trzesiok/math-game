<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tło na żywo</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #eee; font: 14px/1.45 system-ui, sans-serif; overflow: hidden; }
  #scena { position: fixed; inset: 0; }
  #pasek { position: fixed; left: 0; right: 0; bottom: 0; z-index: 2; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 8px 12px; background: rgba(20,20,20,.85); }
  select, button { font: inherit; background: #3a3a3a; color: #eee; border: 1px solid #555; border-radius: 4px; padding: 3px 10px; }
  button.on { background: #2d6cdf; border-color: #2d6cdf; }
  a { color: #8fc0ff; }
</style>
<script>
  // the engine's modules with one stamp per page load (as the game and the editor do, engine/v.js)
  window.__T = Date.now();
  (() => {
    const im = { imports: { three: "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/" } };
    for (const n of ["player", "scene", "lalka", "siatka", "tlo", "olowek", "liczby", "sfx", "speech", "i18n", "v", "geometria", "efekty", "ubior", "odblokuj", "album", "rytm"])
      im.imports[`/game/engine/${n}.js`] = `/game/engine/${n}.js?t=${window.__T}`;
    const s = document.createElement("script"); s.type = "importmap"; s.textContent = JSON.stringify(im); document.currentScript.after(s);
  })();
</script>
</head>
<body>
<div id="scena"></div>
<div id="pasek">
  <a href="tla.html">‹ lista</a>
  <select id="tlo"></select>
  <span id="obszary"></span>
  <label>pogoda <select id="pogoda"><option value="">brak</option></select></label>
  <label><input type="checkbox" id="postacie"> postacie</label>
  <span id="info"></span>
</div>
<script type="module">
// the scenery as the game shows it: the same engine (scene.js), its props swaying and drifting, the panorama's
// areas with the pan between them, the weather on top, two characters for scale
import { Stage } from "/game/engine/scene.js";
import * as E from "/game/engine/efekty.js";
const $ = (id) => document.getElementById(id);
const q = new URLSearchParams(location.search);
const html = await fetch("/game/assets/backgrounds/", { cache: "no-store" }).then((r) => r.text());
const nazwy = [...html.matchAll(/href="([^"?#/]+)\/"/g)].map((m) => decodeURIComponent(m[1]));
$("tlo").innerHTML = nazwy.map((n) => `<option>${n}</option>`).join("");
$("tlo").value = q.get("tlo") || nazwy[0];
$("pogoda").innerHTML += E.CZASTKI.map((c) => `<option>${c}</option>`).join("");
const S = new Stage($("scena"), { tick() {}, say: async () => {}, stop() {} });
await Promise.all([S.puppet("lisek", { x: -4.6, side: "left" }), S.puppet("wiewiorka", { x: 4.6, side: "right" })]);

async function pokaz() {
  const n = $("tlo").value; history.replaceState(null, "", `?tlo=${n}`);
  S.bgName = null; await S.background(n);
  const ile = E.obszaryTla(S);
  $("obszary").innerHTML = ile > 1 ? `obszar: ${[...Array(ile).keys()].map((k) => `<button data-k="${k}" class="${k === 0 ? "on" : ""}">${k}</button>`).join("")}` : "";
  $("info").textContent = ile > 1 ? `panorama, ${ile} obszary - kliknij obszar, by przejechać kamerą` : "";
  if ($("pogoda").value) E.czastki(S, $("pogoda").value);
  postacie();
}
const postacie = () => { for (const n of ["lisek", "wiewiorka"]) { const L = S.puppets[n]; L.korzen.visible = $("postacie").checked; if (L.cien) L.cien.visible = L.korzen.visible; } };
$("obszary").onclick = async (e) => {
  const k = e.target.dataset.k; if (k === undefined) return;
  $("obszary").querySelectorAll("button").forEach((b) => b.classList.toggle("on", b === e.target));
  await E.pan(S, +k, { d: 2.4, idz: $("postacie").checked ? ["lisek", "wiewiorka"] : [] });
};
$("tlo").onchange = pokaz;
$("pogoda").onchange = () => E.czastki(S, $("pogoda").value || null);
$("postacie").onchange = postacie;
await pokaz();
</script>
</body>
</html>
