<!doctype html>
<html lang="pl">
<meta charset="utf-8">
<title>Manager</title>
<style>
  html, body { margin: 0; height: 100%; background: #1f1f1f; color: #eee; font: 13px/1.4 system-ui, sans-serif; }
  body { display: grid; grid-template-columns: 180px 1fr; grid-template-rows: 100%; }
  nav { background: #141414; padding: 12px 0; border-right: 1px solid #333; }
  nav h1 { font-size: 13px; margin: 0 14px 12px; color: #9a9a9a; text-transform: uppercase; letter-spacing: .06em; }
  nav a { display: block; padding: 8px 14px; color: #ddd; text-decoration: none; }
  nav a.aktywny { background: #2d6cdf; color: #fff; }
  nav a.wkrotce { color: #666; cursor: default; }
  nav a.wkrotce small { color: #555; }
  iframe { width: 100%; height: 100%; border: 0; background: #6f6f6f; }
</style>
<nav>
  <h1>Manager</h1>
  <a href="#postacie" class="aktywny" data-src="editor.html">Postacie</a>
  <a href="#lekcje" data-src="lekcje.html">Lekcje</a>
  <a href="#opowiesc" data-src="opowiesc.html">Opowieść</a>
  <a href="#tla" data-src="tla.html">Tła</a>
  <a href="#obiekty" data-src="obiekty.html">Obiekty</a>
  <a href="#znaleziska" data-src="znaleziska.html?rodzaj=znaleziska">Znaleziska</a>
  <a href="#labirynty" data-src="znaleziska.html?rodzaj=labirynty">Labirynty</a>
  <a href="#roznice" data-src="znaleziska.html?rodzaj=roznice">Różnice</a>
  <a href="#ilustracje" data-src="znaleziska.html?rodzaj=ilustracje">Ilustracje</a>
  <a href="#mechaniki" data-src="mechaniki.html">Mechaniki</a>
  <a href="../game/" target="_blank">Gra ↗</a>
</nav>
<iframe id="modul" src="editor.html"></iframe>
<script>
  // the modules; the address keeps the open one (#lekcje), a module may ask the shell to open another
  // (a lesson's "story preview" link) with postMessage({otworz: "opowiesc.html?lekcja=..."})
  const otworz = (a, src) => {
    document.querySelectorAll("nav a").forEach((x) => x.classList.remove("aktywny")); a.classList.add("aktywny");
    document.getElementById("modul").src = src; history.replaceState(null, "", a.getAttribute("href"));
  };
  const zAdresem = (s) => s + (location.search ? (s.includes("?") ? "&" : "?") + location.search.slice(1) : "");   // a module may carry its own query
  for (const a of document.querySelectorAll("nav a[data-src]")) a.onclick = (e) => { e.preventDefault(); otworz(a, zAdresem(a.dataset.src)); };
  const start = document.querySelector(`nav a[href="${location.hash}"]`); if (start) otworz(start, zAdresem(start.dataset.src));
  addEventListener("message", (e) => {
    const src = e.data?.otworz; if (!src) return;
    const a = document.querySelector(`nav a[data-src="${src.split("?")[0]}"]`); if (a) otworz(a, src);
  });
</script>
</html>
